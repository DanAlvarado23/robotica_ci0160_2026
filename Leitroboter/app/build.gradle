plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

android {
    compileSdk 30

    defaultConfig {
        applicationId "com.example.leitroboter"
        minSdk 23
        targetSdk 30
        versionCode 1
        versionName "1.0"

        // La clave de Gemini se configura en server/.env.
        def apiUrl = project.findProperty('DESTINATION_API_URL') ?: 'http://10.0.2.2:8787/match'
        def apiToken = project.findProperty('DESTINATION_API_TOKEN') ?: ''
        resValue 'string', 'destination_api_url', apiUrl.toString()
        resValue 'string', 'destination_api_token', apiToken.toString()

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildFeatures {
        buildConfig false
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    if (project.hasProperty('DEBUG_KEYSTORE')) {
        signingConfigs.debug.storeFile = file(project.property('DEBUG_KEYSTORE'))
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {

    implementation 'androidx.core:core:1.6.0'
    implementation 'androidx.appcompat:appcompat:1.3.1'
    implementation 'com.google.android.material:material:1.4.0'
    // qisdk-design utiliza ConstraintLayout.
    implementation 'androidx.constraintlayout:constraintlayout:2.1.1'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'
    implementation 'com.aldebaran:qisdk:1.7.5'
    implementation 'com.aldebaran:qisdk-design:1.7.5'
}
